@if (totalPages > 1) {
  <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-8">
    <!-- Info -->
    <p class="text-sm text-gray-500">
      Showing <span class="font-medium text-gray-700">{{ fromItem }}</span> to
      <span class="font-medium text-gray-700">{{ toItem }}</span> of
      <span class="font-medium text-gray-700">{{ total }}</span> properties
    </p>

    <!-- Controls -->
    <nav class="flex items-center gap-1">
      <!-- Prev -->
      <button
        (click)="prev()"
        [disabled]="currentPage === 1"
        class="flex items-center gap-1 px-3 py-2 rounded-lg text-sm font-medium border transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
        [class]="currentPage === 1 ? 'border-gray-200 text-gray-400' : 'border-gray-300 text-gray-600 hover:bg-gray-50'"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        <span class="hidden sm:inline">Prev</span>
      </button>

      <!-- Page numbers -->
      @for (page of pages; track $index) {
        @if (page === '...') {
          <span class="px-3 py-2 text-gray-400 text-sm">...</span>
        } @else {
          <button
            (click)="goTo(page)"
            class="w-9 h-9 rounded-lg text-sm font-medium transition-colors"
            [class]="page === currentPage
              ? 'text-white'
              : 'text-gray-600 hover:bg-gray-100 border border-gray-300'"
            [style]="page === currentPage ? 'background-color: #EE0088' : ''"
          >
            {{ page }}
          </button>
        }
      }

      <!-- Next -->
      <button
        (click)="next()"
        [disabled]="currentPage === totalPages"
        class="flex items-center gap-1 px-3 py-2 rounded-lg text-sm font-medium border transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
        [class]="currentPage === totalPages ? 'border-gray-200 text-gray-400' : 'border-gray-300 text-gray-600 hover:bg-gray-50'"
      >
        <span class="hidden sm:inline">Next</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </nav>
  </div>
}
