<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
  <h2 class="text-base font-semibold text-gray-900 mb-5">Filters</h2>

  <!-- Property Type -->
  <div class="mb-5">
    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
      Property Type
    </label>
    <select
      [(ngModel)]="local.type"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:border-transparent"
      style="--tw-ring-color: #EE0088"
    >
      @for (opt of propertyTypes; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  </div>

  <!-- Status -->
  <div class="mb-5">
    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
      Listing Type
    </label>
    <select
      [(ngModel)]="local.status"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:border-transparent"
    >
      @for (opt of statusOptions; track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
      }
    </select>
  </div>

  <!-- Price Range -->
  <div class="mb-5">
    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
      Price Range (€)
    </label>
    <div class="flex gap-2">
      <input
        type="number"
        [(ngModel)]="local.minPrice"
        placeholder="Min"
        min="0"
        class="w-1/2 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:border-transparent"
      />
      <input
        type="number"
        [(ngModel)]="local.maxPrice"
        placeholder="Max"
        min="0"
        class="w-1/2 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:border-transparent"
      />
    </div>
  </div>

  <!-- Bedrooms -->
  <div class="mb-5">
    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
      Bedrooms
    </label>
    <div class="flex gap-1.5 flex-wrap">
      @for (opt of bedroomOptions; track opt.label) {
        <button
          (click)="local.bedrooms = opt.value"
          class="px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors"
          [class]="local.bedrooms === opt.value
            ? 'text-white border-transparent'
            : 'bg-white text-gray-600 border-gray-300 hover:border-gray-400'"
          [style]="local.bedrooms === opt.value ? 'background-color: #EE0088; border-color: #EE0088' : ''"
        >
          {{ opt.label }}
        </button>
      }
    </div>
  </div>

  <!-- Bathrooms -->
  <div class="mb-6">
    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
      Bathrooms
    </label>
    <div class="flex gap-1.5 flex-wrap">
      @for (opt of bathroomOptions; track opt.label) {
        <button
          (click)="local.bathrooms = opt.value"
          class="px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors"
          [class]="local.bathrooms === opt.value
            ? 'text-white border-transparent'
            : 'bg-white text-gray-600 border-gray-300 hover:border-gray-400'"
          [style]="local.bathrooms === opt.value ? 'background-color: #EE0088; border-color: #EE0088' : ''"
        >
          {{ opt.label }}
        </button>
      }
    </div>
  </div>

  <!-- Actions -->
  <div class="flex gap-2">
    <button
      (click)="apply()"
      class="flex-1 text-white py-2.5 rounded-lg text-sm font-semibold transition-opacity hover:opacity-90"
      style="background-color: #EE0088"
    >
      Apply Filters
    </button>
    <button
      (click)="reset()"
      class="px-4 py-2.5 rounded-lg text-sm font-semibold border border-gray-300 text-gray-600 hover:bg-gray-50 transition-colors"
    >
      Reset
    </button>
  </div>
</div>
