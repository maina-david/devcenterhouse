<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2 mb-6">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background-color: #EE0088">
          <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20">
            <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
          </svg>
        </div>
        <span class="font-bold text-gray-900 text-xl">DCH Property</span>
      </a>
      <h1 class="text-2xl font-bold text-gray-900">Create an account</h1>
      <p class="text-gray-500 mt-1">Start saving your favourite properties</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      @if (error()) {
        <div class="mb-5 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">First name</label>
            <input [(ngModel)]="firstName" name="firstName" required
              class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
              placeholder="John" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Last name</label>
            <input [(ngModel)]="lastName" name="lastName" required
              class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
              placeholder="Doe" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <input [(ngModel)]="email" name="email" type="email" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
            placeholder="you@example.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input [(ngModel)]="password" name="password" type="password" required minlength="8"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
            placeholder="Min 8 characters" />
        </div>
        <button type="submit" [disabled]="loading()"
          class="w-full py-3 rounded-xl text-white font-semibold text-sm transition-opacity hover:opacity-90 disabled:opacity-60"
          style="background-color: #EE0088">
          {{ loading() ? 'Creating account...' : 'Create account' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-500">
        Already have an account?
        <a routerLink="/auth/login" class="font-semibold hover:underline" style="color: #EE0088">Sign in</a>
      </p>
    </div>
  </div>
</div>
