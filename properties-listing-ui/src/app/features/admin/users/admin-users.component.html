<div class="flex min-h-screen bg-gray-50">
  <aside class="w-56 bg-gray-900 text-gray-300 hidden md:flex flex-col py-6 shrink-0">
    <div class="px-6 mb-8">
      <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Admin Panel</p>
    </div>
    <nav class="flex-1 px-3 space-y-1">
      <a routerLink="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" /></svg>
        Dashboard
      </a>
      <a routerLink="/admin/properties" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 hover:text-white transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        Properties
      </a>
      <a routerLink="/admin/users" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-gray-800 text-white">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
        Users
      </a>
    </nav>
    <div class="px-3 mt-auto">
      <a routerLink="/properties" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-gray-800 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        Back to site
      </a>
    </div>
  </aside>

  <main class="flex-1 p-6 lg:p-8">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Users</h1>
      <p class="text-gray-500 mt-1">Manage platform users and roles</p>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Name</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Email</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Joined</th>
              <th class="text-left px-6 py-3 text-xs font-semibold text-gray-500 uppercase">Role</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
            @for (user of users(); track user.id) {
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-3 font-medium text-gray-900">{{ user.firstName }} {{ user.lastName }}</td>
                <td class="px-6 py-3 text-gray-600">{{ user.email }}</td>
                <td class="px-6 py-3 text-gray-500">{{ user.createdAt | date: 'dd MMM yyyy' }}</td>
                <td class="px-6 py-3">
                  <select [ngModel]="user.role" (ngModelChange)="updateRole(user.id, $event)"
                    class="text-xs border border-gray-200 rounded-lg px-3 py-1.5 bg-white focus:outline-none focus:border-pink-500">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                  </select>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
