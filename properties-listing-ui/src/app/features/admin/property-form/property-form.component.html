<div class="max-w-3xl mx-auto px-4 py-10">
  <div class="mb-8 flex items-center gap-4">
    <a routerLink="/admin/properties" class="text-gray-400 hover:text-gray-600 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </a>
    <h1 class="text-2xl font-bold text-gray-900">
      {{ isEdit() ? 'Edit Property' : 'Add New Property' }}
    </h1>
  </div>

  @if (error()) {
    <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">{{ error() }}</div>
  }

  <form (ngSubmit)="onSubmit()" class="space-y-6">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-5">
      <h2 class="font-semibold text-gray-900 text-base border-b border-gray-100 pb-3">Basic Information</h2>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Title</label>
        <input [(ngModel)]="form.title" name="title" required
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
          placeholder="e.g. 2 Bed Apartment in Dublin City" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
        <textarea [(ngModel)]="form.description" name="description" rows="4"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 resize-none"
          placeholder="Describe the property..."></textarea>
      </div>

      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Price (€)</label>
          <input [(ngModel)]="form.price" name="price" type="number" min="0" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
            placeholder="1500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Type</label>
          <select [(ngModel)]="form.propertyType" name="propertyType"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 bg-white">
            <option value="apartment">Apartment</option>
            <option value="house">House</option>
            <option value="studio">Studio</option>
            <option value="townhouse">Townhouse</option>
            <option value="bungalow">Bungalow</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Status</label>
          <select [(ngModel)]="form.status" name="status"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 bg-white">
            <option value="for_rent">For Rent</option>
            <option value="for_sale">For Sale</option>
          </select>
        </div>
      </div>

      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Bedrooms</label>
          <input [(ngModel)]="form.bedrooms" name="bedrooms" type="number" min="0"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Bathrooms</label>
          <input [(ngModel)]="form.bathrooms" name="bathrooms" type="number" min="0"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Area (sqft)</label>
          <input [(ngModel)]="form.areaSqft" name="areaSqft" type="number" min="0"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500" />
        </div>
      </div>

      <label class="flex items-center gap-3 cursor-pointer">
        <input [(ngModel)]="form.isFeatured" name="isFeatured" type="checkbox"
          class="w-4 h-4 rounded border-gray-300 text-pink-600 focus:ring-pink-500" />
        <span class="text-sm font-medium text-gray-700">Mark as Featured</span>
      </label>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-5">
      <h2 class="font-semibold text-gray-900 text-base border-b border-gray-100 pb-3">Location</h2>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Address</label>
        <input [(ngModel)]="form.address" name="address" required
          class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
          placeholder="14 Main Street" />
      </div>
      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">City</label>
          <input [(ngModel)]="form.city" name="city" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
            placeholder="Dublin" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">County</label>
          <input [(ngModel)]="form.county" name="county" required
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
            placeholder="Dublin" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Eircode</label>
          <input [(ngModel)]="form.eircode" name="eircode"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
            placeholder="D01 AB12" />
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-4">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h2 class="font-semibold text-gray-900 text-base">Images</h2>
        <button type="button" (click)="addImage()"
          class="text-sm font-medium hover:underline" style="color: #EE0088">
          + Add image URL
        </button>
      </div>
      @for (img of form.images; track trackByIndex($index)) {
        <div class="flex gap-3">
          <input [(ngModel)]="form.images[$index]" [name]="'image_' + $index"
            class="flex-1 px-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500"
            placeholder="https://..." />
          @if (form.images.length > 1) {
            <button type="button" (click)="removeImage($index)"
              class="px-3 text-red-500 hover:text-red-700">×</button>
          }
        </div>
      }
    </div>

    <div class="flex gap-4">
      <button type="submit" [disabled]="loading()"
        class="px-8 py-3 rounded-xl text-white font-medium text-sm transition-opacity hover:opacity-90 disabled:opacity-60"
        style="background-color: #EE0088">
        {{ loading() ? 'Saving...' : (isEdit() ? 'Update Property' : 'Create Property') }}
      </button>
      <a routerLink="/admin/properties"
        class="px-8 py-3 rounded-xl text-gray-700 font-medium text-sm bg-gray-100 hover:bg-gray-200 transition-colors">
        Cancel
      </a>
    </div>
  </form>
</div>
